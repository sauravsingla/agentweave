name: Publish AgentWeave Router Model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hf-model/**'
      - '.github/workflows/publish-model.yml'

permissions:
  id-token: write
  contents: read

jobs:
  publish-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate model package
        run: |
          set -euo pipefail
          test -f hf-model/README.md
          test -f hf-model/config.json
          test -f hf-model/route_prototypes.json
          test -f hf-model/router.py
          test -f hf-model/requirements.txt
          python - <<'PY'
          import json
          from pathlib import Path

          card = Path("hf-model/README.md").read_text(encoding="utf-8")
          config = json.loads(Path("hf-model/config.json").read_text(encoding="utf-8"))

          if "\nbase_model:" in card:
              raise SystemExit("Do not mark AgentWeave as a derived/fine-tuned base_model artifact")
          if "library_name: sentence-transformers" in card:
              raise SystemExit("Do not advertise this routing artifact as a SentenceTransformers checkpoint")
          if config.get("fine_tuned") is not False:
              raise SystemExit("config.json must explicitly state fine_tuned=false")
          if config.get("weights_included") is not False:
              raise SystemExit("config.json must explicitly state weights_included=false")
          if not config.get("encoder_model"):
              raise SystemExit("config.json must define encoder_model")
          print("Validated AgentWeave routing-artifact metadata")
          PY

      - name: Show OIDC claims used for Trusted Publisher matching
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, urllib.parse, urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          sep = "&" if "?" in url else "?"
          url += sep + urllib.parse.urlencode({"audience": "https://huggingface.co"})
          req = urllib.request.Request(
              url,
              headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          with urllib.request.urlopen(req) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          safe = {
              key: claims.get(key)
              for key in ("aud", "repository", "ref", "workflow_ref", "job_workflow_ref")
          }
          print(json.dumps(safe, indent=2))
          PY

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish model to Hugging Face
        env:
          HF_OIDC_RESOURCE: sauravsingla08/AgentWeave-Router-MiniLM
        run: |
          hf upload \
            sauravsingla08/AgentWeave-Router-MiniLM \
            hf-model \
            . \
            --commit-message "Publish AgentWeave Router MiniLM from ${GITHUB_SHA::7}"
