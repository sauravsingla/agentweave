name: Refresh README current release

on:
  push:
    branches:
      - post-release/v0.7.1-cleanup
    paths:
      - '.github/workflows/readme-v071-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: post-release/v0.7.1-cleanup
      - name: Mark v0.7.1 as current release and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          old = '**PyPI:** `agentweave-router` · **Python import:** `agentweave` · **Current release:** `v0.7.0`'
          new = '**PyPI:** `agentweave-router` · **Python import:** `agentweave` · **Current release:** `v0.7.1`'
          if old not in text:
              raise SystemExit('expected README release marker not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/readme-v071-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/readme-v071-refresh.yml
          git commit -m 'docs: mark v0.7.1 as current release'
          git push origin HEAD:post-release/v0.7.1-cleanup
