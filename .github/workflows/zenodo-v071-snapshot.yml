name: Zenodo v0.7.1 API snapshot

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/zenodo-v071-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Query known record and current AgentWeave records
        shell: bash
        run: |
          set -euxo pipefail
          echo '=== Known v0.7.0 record ==='
          curl --fail --silent --show-error --location --max-time 30 \
            'https://zenodo.org/api/records/22913460' \
            | python -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"id":d.get("id"),"doi":d.get("doi"),"conceptdoi":d.get("conceptdoi"),"conceptrecid":d.get("conceptrecid"),"version":(d.get("metadata") or {}).get("version"),"title":(d.get("metadata") or {}).get("title"),"links":d.get("links")}, indent=2, sort_keys=True))'
          echo '=== AgentWeave search ==='
          curl --fail --silent --show-error --location --max-time 30 \
            --get 'https://zenodo.org/api/records' \
            --data-urlencode 'q=AgentWeave' \
            --data-urlencode 'sort=mostrecent' \
            --data-urlencode 'size=20' \
            | python -c 'import json,sys; p=json.load(sys.stdin); hits=(p.get("hits") or {}).get("hits") or []; out=[{"id":x.get("id"),"doi":x.get("doi"),"conceptdoi":x.get("conceptdoi"),"conceptrecid":x.get("conceptrecid"),"version":(x.get("metadata") or {}).get("version"),"title":(x.get("metadata") or {}).get("title"),"html":(x.get("links") or {}).get("html")} for x in hits]; print(json.dumps(out, indent=2, sort_keys=True))'
