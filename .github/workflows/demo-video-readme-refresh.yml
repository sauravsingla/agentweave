name: Add demo video to README

on:
  push:
    branches:
      - docs/demo-video

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/demo-video
      - name: Add Demo Video section
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          heading = '## Demo Video'
          url = 'https://raw.githubusercontent.com/sauravsingla/agentweave/main/assets/agentweave_100k_tools_silent_demo.mp4'
          if heading not in text:
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith('**Quick links:**'):
                      lines[i+1:i+1] = ['', heading, '', url]
                      break
              else:
                  raise SystemExit('Quick links marker not found')
              path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/demo-video-readme-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/demo-video-readme-refresh.yml
          git commit -m 'Add Demo Video section to README'
          git push origin HEAD:docs/demo-video
