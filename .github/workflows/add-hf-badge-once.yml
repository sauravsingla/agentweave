name: Add Hugging Face badge once

on:
  push:
    paths:
      - ".github/workflows/add-hf-badge-once.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Hugging Face dataset badge and quick link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          dataset_url = "https://huggingface.co/datasets/sauravsingla08/AgentWeave-Tool-Routing"
          badge = f"[![Hugging Face Dataset](https://img.shields.io/badge/%F0%9F%A4%97%20Hugging%20Face-Dataset-FFD21E)]({dataset_url})"
          doi_badge = "[![Concept DOI](https://zenodo.org/badge/DOI/10.5281/zenodo.22913459.svg)](https://doi.org/10.5281/zenodo.22913459)"

          if badge not in text:
              if doi_badge not in text:
                  raise SystemExit("Could not find Concept DOI badge anchor in README.md")
              text = text.replace(doi_badge, doi_badge + "\n" + badge, 1)

          quick_link = f"[Hugging Face Dataset]({dataset_url})"
          paper_link = "[Paper](https://arxiv.org/abs/2608.23078)"
          if quick_link not in text:
              if paper_link not in text:
                  raise SystemExit("Could not find Paper quick-link anchor in README.md")
              text = text.replace(paper_link, quick_link + " · " + paper_link, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit README update and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/add-hf-badge-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/add-hf-badge-once.yml
          if git diff --cached --quiet; then
            echo "No README change needed."
            exit 0
          fi
          git commit -m "docs: add Hugging Face dataset badge"
          git push origin HEAD:main
