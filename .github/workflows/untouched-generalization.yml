name: Untouched Generalization Proof

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  general-agentbench-frozen-router:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install AgentWeave
        run: pip install -e .[dev]
      - name: Verify evaluator tests
        run: pytest -q tests/test_untouched_generalization.py
      - name: Fetch pinned General-AgentBench prompts
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/cxcscmu/General-AgentBench.git external-general-agentbench
          cd external-general-agentbench
          git sparse-checkout init --cone
          git sparse-checkout set \
            general_agent/traces/baseline/mathhay_Claude-Haiku-4.5_distraction_all \
            general_agent/traces/baseline/mcpbench_Claude-Haiku-4.5_distraction_all \
            general_agent/traces/baseline/search_Claude-Haiku-4.5_distraction_all \
            general_agent/traces/baseline/swebench_Claude-Haiku-4.5_distraction_100 \
            general_agent/traces/baseline/tau2bench_Claude-Haiku-4.5_distraction_all \
            general_agent/traces/baseline/terminalbench_Claude-Haiku-4.5_distraction_100
          git checkout 35f5c027c31ddcb3366b28674c6cb2957460c0e2
          test "$(git rev-parse HEAD)" = "35f5c027c31ddcb3366b28674c6cb2957460c0e2"
      - name: Run frozen-router untouched evaluation
        run: |
          python scripts/untouched_generalization.py \
            --dataset-root external-general-agentbench/general_agent/traces/baseline
      - name: Upload untouched generalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: untouched-generalization-evidence
          path: |
            untouched-generalization-results.json
            untouched-generalization-results.md
            evaluation/untouched-generalization.json
