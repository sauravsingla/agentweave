name: Router V7 External Holdout

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  router-v7-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install AgentWeave
        run: pip install -e .[dev]
      - name: Verify Router V7 tests
        run: pytest -q tests/test_router_v7.py tests/test_router_v6.py tests/test_router_v5.py tests/test_router_v4.py tests/test_router_v3.py tests/test_router_v2.py tests/test_untouched_generalization.py

      - name: Fetch pinned General-AgentBench development prompts
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/cxcscmu/General-AgentBench.git external-general-agentbench
          cd external-general-agentbench
          git sparse-checkout init --cone
          git sparse-checkout set \
            general_agent/traces/baseline/mathhay_Claude-Haiku-4.5_distraction_all \
            general_agent/traces/baseline/mcpbench_Claude-Haiku-4.5_distraction_all \
            general_agent/traces/baseline/search_Claude-Haiku-4.5_distraction_all \
            general_agent/traces/baseline/swebench_Claude-Haiku-4.5_distraction_100 \
            general_agent/traces/baseline/tau2bench_Claude-Haiku-4.5_distraction_all \
            general_agent/traces/baseline/terminalbench_Claude-Haiku-4.5_distraction_100
          git checkout 35f5c027c31ddcb3366b28674c6cb2957460c0e2
          test "$(git rev-parse HEAD)" = "35f5c027c31ddcb3366b28674c6cb2957460c0e2"

      - name: Fetch preregistered Router V7 holdout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-v7
          curl -fL https://huggingface.co/datasets/AssistantBench/AssistantBench/resolve/482cbbc0400f6d048438c4021727f21a10cbff49/assistant_bench_v1.0_dev.jsonl \
            -o external-v7/assistant_bench_v1.0_dev.jsonl
          curl -fL https://huggingface.co/datasets/AssistantBench/AssistantBench/resolve/482cbbc0400f6d048438c4021727f21a10cbff49/assistant_bench_v1.0_test.jsonl \
            -o external-v7/assistant_bench_v1.0_test.jsonl

      - name: Run Router V7 new holdout once
        run: |
          python scripts/router_v7_holdout.py \
            --development-root external-general-agentbench/general_agent/traces/baseline \
            --external-root external-v7

      - name: Upload Router V7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-v7-external-holdout-evidence
          path: |
            router-v7-holdout-results.json
            router-v7-holdout-results.md
            evaluation/router-v7-holdout.json
