name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Verify release and research-software metadata
        run: python scripts/check_release_metadata.py

  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: pytest -q
      - run: agentweave version

  build-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install pybind11
      - run: cmake -S cpp -B cpp/build -DAGENTWEAVE_BUILD_PYBIND=ON -Dpybind11_DIR=$(python -m pybind11 --cmakedir)
      - run: cmake --build cpp/build --config Release
      - name: Exercise native rank and team selection
        run: |
          PYTHONPATH=cpp/build python - <<'PY'
          import _agentweave_core as c
          a=c.Candidate(); a.id='a'; a.capabilities=['analysis']
          b=c.Candidate(); b.id='b'; b.capabilities=['research']
          ranked=c.rank(['analysis','research'],[a,b])
          assert {x.id for x in ranked}=={'a','b'}
          team=c.select_team(['analysis','research'],ranked,2)
          assert set(team)=={'a','b'}
          print({'ranked':[x.id for x in ranked],'team':team})
          PY

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: pip install -c constraints/ci.txt -e .[dev]
      - name: Ruff correctness gate
        run: ruff check agentweave agentweave_byom agentweave_security tests
      - name: Ruff security-sensitive bug-pattern gate
        run: >-
          ruff check
          agentweave/runtime.py
          agentweave/runtime_hardened.py
          agentweave/runtime_types.py
          agentweave/safe_http.py
          agentweave_security/authorization.py
          agentweave_security/scope_filter.py
          --select E9,F63,F7,F82,B006,B008,B023
      - name: Mypy security-sensitive typed-surface gate
        run: >-
          mypy
          agentweave/runtime_types.py
          agentweave/runtime_hardened.py
          agentweave/safe_http.py
          agentweave_security/authorization.py
          agentweave_security/scope_filter.py
      - name: Bandit security gate
        run: >-
          bandit -q -ll
          agentweave/runtime.py
          agentweave/runtime_hardened.py
          agentweave/runtime_types.py
          agentweave/safe_http.py
          agentweave_security/authorization.py
          agentweave_security/scope_filter.py

  reproducible-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -c constraints/ci.txt -e .[dev]
      - run: python -m pip check
      - run: >-
          pytest -q
          tests/test_runtime_hardening_v07.py
          tests/test_runtime_replay_provenance.py
          tests/test_security_hardening.py
