name: Publish AgentWeave to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "evaluation/**"
      - "research/benchmark_cases.json"
      - "README.md"
      - "PAPER.md"
      - "BFCL_V5_RESULTS.md"
      - "BFCL_V6_RESULTS.md"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: agentweave-huggingface-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Hugging Face dataset package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf hf_dataset
          mkdir -p hf_dataset/data hf_dataset/raw/evaluation hf_dataset/docs

          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("research/benchmark_cases.json")
          payload = json.loads(source.read_text(encoding="utf-8"))
          cases = payload.get("cases", [])
          if not isinstance(cases, list) or not cases:
              raise SystemExit("research/benchmark_cases.json must contain a non-empty 'cases' list")

          out = Path("hf_dataset/data/benchmark_cases.jsonl")
          with out.open("w", encoding="utf-8") as f:
              for idx, query in enumerate(cases, start=1):
                  if not isinstance(query, str) or not query.strip():
                      raise SystemExit(f"benchmark case {idx} must be a non-empty string")
                  row = {
                      "id": idx,
                      "query": query,
                      "dataset": str(payload.get("dataset", "AgentWeave Routing Benchmark v1")),
                      "description": str(payload.get("description", "")),
                  }
                  f.write(json.dumps(row, ensure_ascii=False) + "\n")
          PY

          cp evaluation/*.json hf_dataset/raw/evaluation/
          cp BFCL_V5_RESULTS.md hf_dataset/docs/
          cp BFCL_V6_RESULTS.md hf_dataset/docs/
          cp PAPER.md hf_dataset/docs/

          cat > hf_dataset/README.md <<'EOF'
          ---
          license: apache-2.0
          language:
          - en
          tags:
          - agents
          - function-calling
          - tool-use
          - tool-routing
          - benchmark
          - llm
          - agentic-ai
          pretty_name: AgentWeave Tool-Routing Benchmark
          task_categories:
          - text-generation
          configs:
          - config_name: default
            default: true
            data_files:
            - split: test
              path: data/benchmark_cases.jsonl
          ---

          # AgentWeave Tool-Routing Benchmark

          Benchmark cases and evaluation artifacts for **AgentWeave**, a deterministic pre-inference routing layer for tool-rich language-model systems.

          ## Contents

          - `data/benchmark_cases.jsonl` — the canonical, normalized Dataset Viewer split.
          - `raw/evaluation/` — frozen heterogeneous evaluation artifacts retained as reproducibility evidence and intentionally excluded from the Viewer schema.
          - `docs/` — BFCL result summaries and paper notes.

          The explicit `configs.data_files` declaration above ensures Hugging Face renders only the normalized benchmark table in Dataset Viewer while preserving raw evaluation JSON files for download and audit.

          ## Paper

          **AgentWeave: Routing Before Reasoning for Efficient Function Calling in Tool-Rich Language Models**  
          arXiv: https://arxiv.org/abs/2608.23078

          ## Related artifacts

          - Model/router artifact: https://huggingface.co/sauravsingla08/AgentWeave-Router-MiniLM
          - Interactive Space: https://huggingface.co/spaces/sauravsingla08/AgentWeave
          - Source code: https://github.com/sauravsingla/agentweave

          ## Notes

          This Hub repository publishes benchmark/evaluation data rather than model weights. The AgentWeave runtime and implementation remain in the canonical GitHub repository.

          ## License

          Apache-2.0, matching the source repository.
          EOF

      - name: Validate Viewer-facing dataset schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("hf_dataset/data/benchmark_cases.jsonl")
          rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          if not rows:
              raise SystemExit("Viewer-facing dataset is empty")
          expected = {"id", "query", "dataset", "description"}
          for idx, row in enumerate(rows, start=1):
              if set(row) != expected:
                  raise SystemExit(f"row {idx} schema mismatch: {sorted(row)}")
              if not isinstance(row["id"], int) or not isinstance(row["query"], str):
                  raise SystemExit(f"row {idx} has invalid field types")
          print(f"Validated {len(rows)} normalized AgentWeave benchmark rows")
          PY

      - name: Install Hugging Face CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish dataset to Hugging Face
        env:
          HF_OIDC_RESOURCE: datasets/sauravsingla08/AgentWeave-Tool-Routing
        shell: bash
        run: |
          set -euo pipefail
          hf upload sauravsingla08/AgentWeave-Tool-Routing hf_dataset . \
            --repo-type=dataset \
            --commit-message="Sync AgentWeave benchmark from GitHub ${GITHUB_SHA::7}"
