name: Team Advantage Benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  team-advantage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install AgentWeave
        run: pip install -e .[dev]
      - name: Run executable team advantage benchmark
        run: python scripts/team_advantage_benchmark.py --validate
      - name: Run benchmark tests
        run: pytest -q tests/test_team_advantage_benchmark.py tests/test_optimizer_relevance.py
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-advantage-evidence
          path: |
            team-advantage-results.json
            team-advantage-results.md
