name: One-time Hugging Face 10-cycle stress test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hf-stress-test.yml'

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install test dependencies
        run: python -m pip install --quiet --upgrade huggingface_hub

      - name: Run 10 concurrent public API probes
        run: |
          python - <<'PY'
          import concurrent.futures, json, statistics, time, urllib.request

          url = "https://huggingface.co/api/models/sauravsingla08/AgentWeave-Router-MiniLM"

          def probe(i):
              start = time.perf_counter()
              req = urllib.request.Request(url, headers={"User-Agent": "AgentWeave-stress-test/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read()
                  status = r.status
              elapsed = (time.perf_counter() - start) * 1000
              data = json.loads(body)
              assert data.get("modelId") == "sauravsingla08/AgentWeave-Router-MiniLM"
              return i, status, elapsed

          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              results = list(ex.map(probe, range(1, 11)))

          for i, status, ms in results:
              print(f"API probe {i:02d}: status={status} latency_ms={ms:.1f}")
          latencies = [x[2] for x in results]
          print(f"API summary: success={len(results)}/10 min_ms={min(latencies):.1f} avg_ms={statistics.mean(latencies):.1f} max_ms={max(latencies):.1f}")
          PY

      - name: Download model once from Hugging Face
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          path = snapshot_download(
              repo_id="sauravsingla08/AgentWeave-Router-MiniLM",
              local_dir="/tmp/AgentWeave-Router-MiniLM",
          )
          print(f"Downloaded to: {path}")
          PY

      - name: Run 10 parallel artifact integrity cycles
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, py_compile, time, statistics

          root = pathlib.Path('/tmp/AgentWeave-Router-MiniLM')
          required = ['README.md', 'config.json', 'route_prototypes.json', 'router.py', 'requirements.txt']

          def cycle(i):
              start = time.perf_counter()
              digest = hashlib.sha256()
              for name in required:
                  p = root / name
                  assert p.is_file(), f"missing {name}"
                  digest.update(p.read_bytes())
              json.loads((root / 'config.json').read_text())
              json.loads((root / 'route_prototypes.json').read_text())
              py_compile.compile(str(root / 'router.py'), doraise=True)
              elapsed = (time.perf_counter() - start) * 1000
              return i, elapsed, digest.hexdigest()[:16]

          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              results = list(ex.map(cycle, range(1, 11)))

          for i, ms, digest in results:
              print(f"Integrity cycle {i:02d}: ok latency_ms={ms:.1f} digest={digest}")
          assert len({x[2] for x in results}) == 1, 'artifact digest mismatch across cycles'
          latencies = [x[1] for x in results]
          print(f"Integrity summary: success={len(results)}/10 min_ms={min(latencies):.1f} avg_ms={statistics.mean(latencies):.1f} max_ms={max(latencies):.1f}")
          PY
