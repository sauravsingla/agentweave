name: One-time AgentWeave 1000-user local stress test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hf-local-1000-user-stress.yml'

permissions:
  contents: read

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade huggingface_hub
          python -m pip install --quiet "sentence-transformers>=3.0.0" "numpy>=1.26.0"

      - name: Download published model once
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          path = snapshot_download(
              repo_id="sauravsingla08/AgentWeave-Router-MiniLM",
              local_dir="/tmp/AgentWeave-Router-MiniLM",
          )
          print(f"Downloaded model package to: {path}")
          PY

      - name: Run 1000 virtual-user local inference stress test
        env:
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python - <<'PY'
          import concurrent.futures
          import importlib.util
          import math
          import pathlib
          import statistics
          import sys
          import time

          root = pathlib.Path('/tmp/AgentWeave-Router-MiniLM')
          spec = importlib.util.spec_from_file_location('agentweave_router', root / 'router.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          print('Loading AgentWeaveSemanticRouter and base embedding model...')
          init_start = time.perf_counter()
          router = mod.AgentWeaveSemanticRouter()
          init_ms = (time.perf_counter() - init_start) * 1000
          print(f'Router initialization_ms={init_ms:.1f}')

          queries = [
              'Search recent research papers and summarize findings',
              'Send an email with the project update',
              'Look up weather conditions for a destination',
              'Find files related to quarterly planning',
              'Create a calendar meeting for next Tuesday',
              'Analyze a dataset and report anomalies',
              'Search the web for current AI news',
              'Read a repository issue and summarize it',
              'Retrieve customer records from a database',
              'Draft a concise response to this message',
          ]

          total_requests = 1000
          max_workers = 100

          def one_request(i):
              q = queries[i % len(queries)]
              start = time.perf_counter()
              try:
                  result = router.route(q, top_k=3)
                  elapsed = (time.perf_counter() - start) * 1000
                  if not result or not isinstance(result, list):
                      return False, elapsed, 'invalid_result'
                  return True, elapsed, None
              except Exception as exc:
                  elapsed = (time.perf_counter() - start) * 1000
                  return False, elapsed, f'{type(exc).__name__}: {exc}'

          wall_start = time.perf_counter()
          with concurrent.futures.ThreadPoolExecutor(max_workers=max_workers) as ex:
              results = list(ex.map(one_request, range(total_requests)))
          wall_s = time.perf_counter() - wall_start

          success_lat = [ms for ok, ms, err in results if ok]
          failures = [(i, err) for i, (ok, ms, err) in enumerate(results) if not ok]

          def pct(values, p):
              if not values:
                  return float('nan')
              vals = sorted(values)
              k = max(0, min(len(vals) - 1, math.ceil((p / 100) * len(vals)) - 1))
              return vals[k]

          success = len(success_lat)
          failure = len(failures)
          throughput = success / wall_s if wall_s else 0.0

          print('--- STRESS TEST SUMMARY ---')
          print(f'total_requests={total_requests}')
          print(f'max_concurrent_workers={max_workers}')
          print(f'success={success}')
          print(f'failures={failure}')
          print(f'success_rate_pct={(success / total_requests) * 100:.2f}')
          print(f'wall_time_s={wall_s:.3f}')
          print(f'throughput_req_per_s={throughput:.2f}')
          if success_lat:
              print(f'latency_min_ms={min(success_lat):.2f}')
              print(f'latency_avg_ms={statistics.mean(success_lat):.2f}')
              print(f'latency_p50_ms={pct(success_lat, 50):.2f}')
              print(f'latency_p95_ms={pct(success_lat, 95):.2f}')
              print(f'latency_p99_ms={pct(success_lat, 99):.2f}')
              print(f'latency_max_ms={max(success_lat):.2f}')
          if failures:
              print('sample_failures:')
              for idx, err in failures[:10]:
                  print(f'  request={idx} error={err}')

          if failure:
              sys.exit(1)
          PY
