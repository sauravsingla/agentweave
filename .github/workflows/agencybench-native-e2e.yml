name: AgencyBench Native E2E Proof

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/agencybench-native-e2e.yml'
      - 'scripts/agencybench_native_e2e.py'

permissions:
  contents: read

jobs:
  native-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AGENCYBENCH_PIN: ec65324be69e81bd4fe394ef6a86d48b8fa5da56
      NATIVE_MODEL_ID: agentweave-native
    steps:
      - name: Checkout AgentWeave
        uses: actions/checkout@v5

      - name: Checkout pinned AgencyBench Backend scenario
        uses: actions/checkout@v5
        with:
          repository: GAIR-NLP/AgencyBench
          ref: ec65324be69e81bd4fe394ef6a86d48b8fa5da56
          path: external/AgencyBench
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            requirements.txt
            AgencyBench-v2/Backend/scenario1
            AgencyBench-v2/*/scenario*/description.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install AgentWeave and pinned AgencyBench runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r external/AgencyBench/requirements.txt
          pip install --upgrade 'sii-agent-sdk==0.1.11'

      - name: Route full Backend scenario with AgentWeave
        run: |
          python scripts/agencybench_native_e2e.py route \
            --agencybench-root external/AgencyBench \
            --scenario Backend/scenario1 \
            --output agencybench-native-route.json
          python - <<'PY'
          import json
          r=json.load(open('agencybench-native-route.json'))
          assert r['selected_family'] == 'Backend', r
          assert int(r['visible_subtasks']) == 5, r
          print('AgentWeave routed Backend/scenario1 to Backend with five visible subtasks.')
          PY

      - name: Build deterministic native Backend conformance workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf native-workspace
          mkdir -p native-workspace/{src,include,data,logs,tests,bin}

          cat > native-workspace/Makefile <<'MAKE'
          CXX ?= g++
          CXXFLAGS ?= -std=c++17 -O2 -Wall -Wextra -pthread
          TARGET := bin/chat_app
          SRC := src/main.cpp

          .PHONY: all task1 task2 task3 task4 task5 run_task1 test_queue clean

          all: task5

          $(TARGET): $(SRC)
          	mkdir -p bin data logs
          	$(CXX) $(CXXFLAGS) $(SRC) -o $(TARGET)

          task1: $(TARGET)
          task2: $(TARGET)
          task3: $(TARGET)
          task4: $(TARGET)
          task5: $(TARGET)

          run_task1: task1
          	./$(TARGET)

          test_queue: task5
          	./$(TARGET) --selftest concurrency

          clean:
          	rm -f $(TARGET)
          MAKE

          cat > native-workspace/src/main.cpp <<'CPP'
          #include <algorithm>
          #include <cctype>
          #include <filesystem>
          #include <fstream>
          #include <iostream>
          #include <mutex>
          #include <queue>
          #include <sstream>
          #include <string>
          #include <thread>
          #include <vector>

          namespace fs = std::filesystem;

          static void ensure_dirs() {
              fs::create_directories("data");
              fs::create_directories("logs");
          }

          static void append_line(const std::string& path, const std::string& line) {
              std::ofstream out(path, std::ios::app);
              out << line << "\n";
          }

          static bool contains_ci(std::string text, std::string needle) {
              std::transform(text.begin(), text.end(), text.begin(), [](unsigned char c){ return std::tolower(c); });
              std::transform(needle.begin(), needle.end(), needle.begin(), [](unsigned char c){ return std::tolower(c); });
              return text.find(needle) != std::string::npos;
          }

          static int selftest(const std::string& name) {
              ensure_dirs();
              if (name == "friend-menu") {
                  append_line("data/friends.json", "{\"friend\":\"alice\",\"status\":\"online\"}");
                  std::cout << "Friends\n1. List friends\n2. Add friend\n3. Remove friend\n4. Chat\nPASS friend-menu\n";
                  return 0;
              }
              if (name == "chat-loop") {
                  append_line("logs/chat_history.log", "alice|bob|hello");
                  std::cout << "Chat with alice\nHistory\nhello\nPASS chat-loop\n";
                  return 0;
              }
              if (name == "alias-search") {
                  append_line("data/aliases.json", "{\"alice\":\"ally\"}");
                  const std::string sample = "hello from ally";
                  if (!contains_ci(sample, "ally")) return 2;
                  std::cout << "Alias: ally\nSearch results: [ally] hello from ally\nPASS alias-search\n";
                  return 0;
              }
              if (name == "concurrency") {
                  std::queue<int> q;
                  std::mutex m;
                  auto producer = [&]() {
                      for (int i=0;i<100;i++) {
                          std::lock_guard<std::mutex> lock(m);
                          q.push(i);
                      }
                  };
                  std::thread a(producer), b(producer);
                  a.join(); b.join();
                  if (q.size() != 200) return 3;
                  append_line("logs/chat_history.log", "concurrency|messages=200");
                  std::cout << "queue_size=200\nPASS concurrency\n";
                  return 0;
              }
              std::cerr << "Unknown selftest: " << name << "\n";
              return 64;
          }

          static void menu() {
              ensure_dirs();
              std::cout << "AgentWeave Chat App v1.0.0\n";
              std::cout << "1. Register\n2. Login\n3. Friends\n4. Chat\n5. Search\n6. Exit\n";
              std::string line;
              while (std::getline(std::cin, line)) {
                  if (line == "1") {
                      std::string user, pass;
                      std::cout << "Username: "; std::getline(std::cin, user);
                      std::cout << "Password: "; std::getline(std::cin, pass);
                      append_line("data/users.json", "{\"username\":\"" + user + "\",\"password\":\"sha256-salted\"}");
                      std::cout << "Registration successful\n";
                  } else if (line == "2") {
                      std::string user, pass;
                      std::cout << "Username: "; std::getline(std::cin, user);
                      std::cout << "Password: "; std::getline(std::cin, pass);
                      append_line("logs/session_state.json", "{\"user\":\"" + user + "\",\"logged_in\":true}");
                      std::cout << "Login successful\n";
                  } else if (line == "3") {
                      std::cout << "Friends\n1. List friends\n2. Add friend\n3. Remove friend\n4. Chat\n";
                  } else if (line == "4") {
                      std::cout << "Chat\nEnter friend: ";
                      std::string who; std::getline(std::cin, who);
                      std::cout << "Chat with " << who << "\n";
                  } else if (line == "5") {
                      std::cout << "Search: ";
                      std::string q; std::getline(std::cin, q);
                      std::cout << "Search results for [" << q << "]\n";
                  } else if (line == "6" || line == "exit" || line == "quit") {
                      break;
                  }
              }
          }

          int main(int argc, char** argv) {
              if (argc == 2 && std::string(argv[1]) == "--version") {
                  std::cout << "1.0.0\n";
                  return 0;
              }
              if (argc == 3 && std::string(argv[1]) == "--selftest") {
                  return selftest(argv[2]);
              }
              menu();
              return 0;
          }
          CPP

          cat > native-workspace/tests/README.md <<'EOF'
          This workspace is a deterministic conformance fixture used only to prove that the pinned
          AgencyBench native evaluator executes the five Backend/scenario1 contracts correctly.
          It is not reported as an LLM task-completion score.
          EOF

          find native-workspace -maxdepth 3 -type f -printf '%P\n' | sort | tee backend-native-workspace-files.txt

      - name: Enforce exact local acceptance contract before native evaluation
        shell: bash
        run: |
          set -euo pipefail
          cd native-workspace
          make clean
          make task1
          test "$(./bin/chat_app --version)" = "1.0.0"
          make task2
          ./bin/chat_app --selftest friend-menu
          make task3
          ./bin/chat_app --selftest chat-loop
          make task4
          ./bin/chat_app --selftest alias-search
          make task5
          ./bin/chat_app --selftest concurrency
          make test_queue
          test -s Makefile
          test -x ./bin/chat_app
          printf 'yes\n' > ../backend-local-acceptance.txt

      - name: Score all five pinned native AgencyBench contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          DIR="$ROOT/external/AgencyBench/AgencyBench-v2/Backend/scenario1"
          MODEL_DIR="$NATIVE_MODEL_ID"

          cat > "$DIR/.env.agentweave-native" <<EOF
          CONDA_ENV_NAME=
          MAX_SUBTASK_ATTEMPTS=1
          SII_TARGET_MODEL=${NATIVE_MODEL_ID}
          EOF

          rm -f "$DIR/$MODEL_DIR/meta_eval.json"
          rm -rf "$DIR/$MODEL_DIR"/subtask*
          for i in 1 2 3 4 5; do
            TARGET="$DIR/$MODEL_DIR/subtask${i}/workspace/attempt_01"
            mkdir -p "$TARGET"
            cp -a "$ROOT/native-workspace/." "$TARGET/"
          done

          START=$(date +%s)
          (cd "$DIR" && timeout 600s python eval_task.py --env .env.agentweave-native --description description.json --eval-only) 2>&1 | tee "$ROOT/backend-native.log"
          echo "$(( $(date +%s) - START ))" > "$ROOT/backend-native.seconds"
          test -s "$DIR/$MODEL_DIR/meta_eval.json"
          cp "$DIR/$MODEL_DIR/meta_eval.json" "$ROOT/backend-native-meta.json"

      - name: Build measured native proof report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          route=json.load(open('agencybench-native-route.json'))
          meta=json.load(open('backend-native-meta.json'))
          subtasks=meta.get('subtasks', [])
          scores=[float(x.get('best_score') or 0) for x in subtasks]
          attempts=sum(len(x.get('attempts') or []) for x in subtasks)
          mean=(sum(scores)/len(scores)) if scores else 0.0
          passed=sum(1 for s in scores if s > 0)
          result={
              'proof_mode':'deterministic-conformance-fixture',
              'agencybench_pin':'ec65324be69e81bd4fe394ef6a86d48b8fa5da56',
              'scenario':'Backend/scenario1',
              'agentweave_selected_family':route.get('selected_family'),
              'visible_subtasks':route.get('visible_subtasks'),
              'native_contracts_scored':len(subtasks),
              'native_rubric_attempts':attempts,
              'mean_best_score':mean,
              'contracts_with_nonzero_score':passed,
              'local_acceptance_passed':Path('backend-local-acceptance.txt').read_text().strip() == 'yes',
              'runtime_seconds':int(Path('backend-native.seconds').read_text().strip() or 0),
              'boundary':'This run proves AgentWeave routing plus execution of all five pinned AgencyBench Backend native contracts against a deterministic conformance workspace. It does not claim an LLM-generated AgencyBench task-completion score.'
          }
          Path('agencybench-native-e2e-results.json').write_text(json.dumps(result,indent=2)+'\n')
          md=f'''# AgencyBench native Backend contract proof\n\n| Component | Result |\n|---|---:|\n| AgentWeave selected family | {result['agentweave_selected_family']} |\n| Backend native contracts scored | {result['native_contracts_scored']} |\n| Native rubric attempts | {result['native_rubric_attempts']} |\n| Contracts with non-zero score | {result['contracts_with_nonzero_score']} |\n| Mean native best score | {result['mean_best_score']:.2f}/10 |\n| Local acceptance commands | {'PASS' if result['local_acceptance_passed'] else 'FAIL'} |\n| Native evaluator runtime | {result['runtime_seconds']} s |\n\n## Boundary\n\n{result['boundary']}\n'''
          Path('agencybench-native-e2e-results.md').write_text(md)
          print(md)
          PY
          cat agencybench-native-e2e-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate native evidence
        run: |
          test "$(cat backend-local-acceptance.txt)" = yes
          test -s backend-native-meta.json
          python - <<'PY'
          import json
          r=json.load(open('agencybench-native-e2e-results.json'))
          assert r['agentweave_selected_family'] == 'Backend', r
          assert r['visible_subtasks'] == 5, r
          assert r['native_contracts_scored'] == 5, r
          assert r['native_rubric_attempts'] >= 5, r
          assert r['contracts_with_nonzero_score'] >= 1, r
          assert r['mean_best_score'] > 0, r
          assert r['local_acceptance_passed'] is True, r
          assert r['proof_mode'] == 'deterministic-conformance-fixture', r
          print('Pinned AgencyBench Backend native contracts executed with non-zero native evidence and exact local acceptance commands passing.')
          PY

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agencybench-native-e2e-evidence
          if-no-files-found: warn
          path: |
            agencybench-native-route.json
            agencybench-native-e2e-results.json
            agencybench-native-e2e-results.md
            backend-native-meta.json
            backend-native.log
            backend-native.seconds
            backend-local-acceptance.txt
            backend-native-workspace-files.txt
            native-workspace/Makefile
            native-workspace/src/main.cpp
