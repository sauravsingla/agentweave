name: AgencyBench Native E2E Proof

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/agencybench-native-e2e.yml'
      - 'scripts/github_models_meter_proxy.py'
      - 'scripts/agencybench_native_e2e.py'

permissions:
  contents: read
  models: read

jobs:
  native-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      AGENCYBENCH_PIN: ec65324be69e81bd4fe394ef6a86d48b8fa5da56
      PRIMARY_MODEL: openai/gpt-4.1
      FALLBACK_MODEL: openai/gpt-4o
      VISION_MODEL: openai/gpt-4o
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout AgentWeave
        uses: actions/checkout@v5

      - name: Checkout pinned AgencyBench native scenarios
        uses: actions/checkout@v5
        with:
          repository: GAIR-NLP/AgencyBench
          ref: ec65324be69e81bd4fe394ef6a86d48b8fa5da56
          path: external/AgencyBench
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            requirements.txt
            AgencyBench-v2/Backend/scenario1
            AgencyBench-v2/Frontend/scenario1
            AgencyBench-v2/*/scenario*/description.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install AgentWeave and AgencyBench runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r external/AgencyBench/requirements.txt

      - name: Start metered GitHub Models gateways
        run: |
          mkdir -p native-e2e-meter
          nohup python scripts/github_models_meter_proxy.py --port 8911 --label agent --log native-e2e-meter/agent.jsonl > native-e2e-meter/agent-proxy.log 2>&1 & echo $! > native-e2e-meter/agent.pid
          nohup python scripts/github_models_meter_proxy.py --port 8912 --label text-evaluator --log native-e2e-meter/text-evaluator.jsonl > native-e2e-meter/text-proxy.log 2>&1 & echo $! > native-e2e-meter/text.pid
          nohup python scripts/github_models_meter_proxy.py --port 8913 --label vision-evaluator --log native-e2e-meter/vision-evaluator.jsonl > native-e2e-meter/vision-proxy.log 2>&1 & echo $! > native-e2e-meter/vision.pid
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:8911/models >/dev/null

      - name: Prove live GitHub Models inference
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8911/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"openai/gpt-4.1","messages":[{"role":"user","content":"Return exactly: AGENCYBENCH_MODEL_READY"}],"temperature":0,"max_tokens":20}' \
            | tee native-e2e-meter/model-smoke.json
          grep -q 'AGENCYBENCH_MODEL_READY' native-e2e-meter/model-smoke.json

      - name: Route Backend scenario with AgentWeave
        run: |
          python scripts/agencybench_native_e2e.py route \
            --agencybench-root external/AgencyBench \
            --scenario Backend/scenario1 \
            --output agencybench-native-route.json

      - name: Run full native Backend scenario1 with primary AgentWeave-selected agent
        id: backend_primary
        shell: bash
        run: |
          set +e
          DIR=external/AgencyBench/AgencyBench-v2/Backend/scenario1
          FAMILY=$(python - <<'PY'
          import json
          print(json.load(open('agencybench-native-route.json'))['selected_family'])
          PY
          )
          cat > "$DIR/.env.agentweave" <<EOF
          CONDA_ENV_NAME=
          MAX_SUBTASK_ATTEMPTS=2
          BRIDGE_TIMEOUT_MS=300000
          SII_AGENT_API_KEY=${GITHUB_TOKEN}
          SII_AGENT_API_BASE_URL=http://127.0.0.1:8911
          SII_AUTH_TYPE=USE_OPENAI
          SII_TARGET_MODEL=${PRIMARY_MODEL}
          SII_SYSTEM_PROMPT=You are the ${FAMILY} specialist selected by AgentWeave. Work autonomously inside the assigned AgencyBench workspace. Use tools, compile and test repeatedly, preserve prior subtask work, and respond to evaluator feedback until the deliverables satisfy the task.
          SII_MAX_TURNS=120
          EOF
          START=$(date +%s)
          timeout 3300s python "$DIR/eval_task.py" --env "$DIR/.env.agentweave" --description "$DIR/description.json" 2>&1 | tee backend-primary.log
          RC=${PIPESTATUS[0]}
          END=$(date +%s)
          echo "$RC" > backend-primary.rc
          echo "$((END-START))" > backend-primary.seconds
          META=$(find "$DIR" -mindepth 2 -maxdepth 2 -name meta_eval.json ! -path '*/claude/*' -print | grep -F 'gpt-4.1' | head -1)
          if [ -n "$META" ]; then cp "$META" backend-primary-meta.json; fi
          exit 0

      - name: Decide and execute AgentWeave recovery re-route
        shell: bash
        run: |
          set +e
          NEED_RECOVERY=$(python - <<'PY'
          import json, pathlib
          p=pathlib.Path('backend-primary-meta.json')
          if not p.exists():
              print('yes'); raise SystemExit
          m=json.load(p.open())
          scores=[float(x.get('best_score') or 0) for x in m.get('subtasks',[])]
          complete=len(scores) >= 5
          mean=sum(scores)/len(scores) if scores else 0
          print('yes' if (not complete or mean < 6.0) else 'no')
          PY
          )
          echo "$NEED_RECOVERY" > backend-recovery-triggered.txt
          if [ "$NEED_RECOVERY" != "yes" ]; then
            echo 'Primary completed with sufficient native score; fallback not needed.'
            exit 0
          fi
          DIR=external/AgencyBench/AgencyBench-v2/Backend/scenario1
          FAMILY=$(python - <<'PY'
          import json
          print(json.load(open('agencybench-native-route.json'))['selected_family'])
          PY
          )
          cat > "$DIR/.env.agentweave-fallback" <<EOF
          CONDA_ENV_NAME=
          MAX_SUBTASK_ATTEMPTS=2
          BRIDGE_TIMEOUT_MS=300000
          SII_AGENT_API_KEY=${GITHUB_TOKEN}
          SII_AGENT_API_BASE_URL=http://127.0.0.1:8911
          SII_AUTH_TYPE=USE_OPENAI
          SII_TARGET_MODEL=${FALLBACK_MODEL}
          SII_SYSTEM_PROMPT=You are the backup ${FAMILY} specialist selected by AgentWeave after the primary agent failed to reach the native AgencyBench acceptance threshold. Work autonomously, compile and test every deliverable, and use native evaluator feedback to repair failures.
          SII_MAX_TURNS=120
          EOF
          START=$(date +%s)
          timeout 2100s python "$DIR/eval_task.py" --env "$DIR/.env.agentweave-fallback" --description "$DIR/description.json" 2>&1 | tee backend-fallback.log
          RC=${PIPESTATUS[0]}
          END=$(date +%s)
          echo "$RC" > backend-fallback.rc
          echo "$((END-START))" > backend-fallback.seconds
          META=$(find "$DIR" -mindepth 2 -maxdepth 2 -name meta_eval.json ! -path '*/claude/*' -print | grep -F 'gpt-4o' | head -1)
          if [ -n "$META" ]; then cp "$META" backend-fallback-meta.json; fi
          exit 0

      - name: Start official AgencyBench Docker sandbox
        shell: bash
        run: |
          docker pull ghcr.io/agent-infra/sandbox:latest
          docker run --security-opt seccomp=unconfined --rm -d --name agencybench-sandbox -p 8080:8080 ghcr.io/agent-infra/sandbox:latest
          READY=no
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080 >/dev/null 2>&1; then READY=yes; break; fi
            sleep 2
          done
          echo "$READY" > docker-sandbox-ready.txt
          test "$READY" = yes
          docker inspect agencybench-sandbox > docker-sandbox-inspect.json

      - name: Run native Frontend Docker + text/vision judge smoke
        shell: bash
        run: |
          set +e
          DIR=external/AgencyBench/AgencyBench-v2/Frontend/scenario1
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('external/AgencyBench/AgencyBench-v2/Frontend/scenario1/description.json')
          d=json.load(p.open())
          out={'subtask_count':1,'subtask1':d['subtask1']}
          Path('external/AgencyBench/AgencyBench-v2/Frontend/scenario1/description.agentweave.json').write_text(json.dumps(out,indent=2))
          PY
          cat > "$DIR/.env.agentweave" <<EOF
          CONDA_ENV_NAME=
          SANDBOX_BASE_URL=http://127.0.0.1:8080
          MAX_SUBTASK_ATTEMPTS=2
          BRIDGE_TIMEOUT_MS=300000
          SANDBOX_TIMEOUT_SEC=60
          SII_AGENT_API_KEY=${GITHUB_TOKEN}
          SII_AGENT_API_BASE_URL=http://127.0.0.1:8911
          SII_AUTH_TYPE=USE_OPENAI
          SII_TARGET_MODEL=${PRIMARY_MODEL}
          SII_SYSTEM_PROMPT=You are the Frontend specialist selected by AgentWeave. Build the requested deliverable in the assigned workspace, use browser-oriented evidence where appropriate, and repair the result from evaluator feedback.
          SII_MAX_TURNS=100
          EVAL_TEXT_API_KEY=${GITHUB_TOKEN}
          EVAL_TEXT_API_BASE_URL=http://127.0.0.1:8912
          EVAL_TEXT_MODEL=${PRIMARY_MODEL}
          EVAL_VISION_PROVIDER=qwen
          VISION_MODEL=${VISION_MODEL}
          QWEN_VISION_BASE_URL=http://127.0.0.1:8913
          QWEN_VISION_API_KEY=${GITHUB_TOKEN}
          EOF
          START=$(date +%s)
          timeout 1800s python "$DIR/eval_task.py" --env "$DIR/.env.agentweave" --description "$DIR/description.agentweave.json" 2>&1 | tee frontend-native.log
          RC=${PIPESTATUS[0]}
          END=$(date +%s)
          echo "$RC" > frontend-native.rc
          echo "$((END-START))" > frontend-native.seconds
          META=$(find "$DIR" -mindepth 2 -maxdepth 2 -name meta_eval.json ! -path '*/claude/*' -print | grep -F 'gpt-4.1' | head -1)
          if [ -n "$META" ]; then cp "$META" frontend-native-meta.json; fi
          exit 0

      - name: Build measured native E2E report
        shell: bash
        run: |
          PRIMARY_SECONDS=$(cat backend-primary.seconds 2>/dev/null || echo 0)
          FALLBACK_SECONDS=$(cat backend-fallback.seconds 2>/dev/null || echo 0)
          FRONTEND_SECONDS=$(cat frontend-native.seconds 2>/dev/null || echo 0)
          ARGS=(report --route agencybench-native-route.json \
            --meter native-e2e-meter/agent.jsonl \
            --meter native-e2e-meter/text-evaluator.jsonl \
            --meter native-e2e-meter/vision-evaluator.jsonl \
            --runtime backend_primary_seconds=${PRIMARY_SECONDS} \
            --runtime backend_fallback_seconds=${FALLBACK_SECONDS} \
            --runtime frontend_seconds=${FRONTEND_SECONDS})
          [ -f backend-primary-meta.json ] && ARGS+=(--backend-meta backend-primary-meta.json)
          [ -f backend-fallback-meta.json ] && ARGS+=(--backend-fallback-meta backend-fallback-meta.json)
          [ -f frontend-native-meta.json ] && ARGS+=(--frontend-meta frontend-native-meta.json)
          python scripts/agencybench_native_e2e.py "${ARGS[@]}"
          cat agencybench-native-e2e-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate actual native components executed
        shell: bash
        run: |
          test -s native-e2e-meter/model-smoke.json
          test -s native-e2e-meter/agent.jsonl
          test "$(cat docker-sandbox-ready.txt)" = yes
          test -s backend-primary-meta.json
          test -s frontend-native-meta.json
          python - <<'PY'
          import json
          r=json.load(open('agencybench-native-e2e-results.json'))
          assert r['metering']['model_requests'] > 1, r
          assert r['backend_primary']['subtasks'] >= 1, r
          assert r['frontend_docker_native_judge']['subtasks'] >= 1, r
          print('Native AgencyBench execution, metering, Docker evidence and native judge artifacts are present.')
          PY

      - name: Upload native AgencyBench evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agencybench-native-e2e-evidence
          if-no-files-found: warn
          path: |
            agencybench-native-route.json
            agencybench-native-e2e-results.json
            agencybench-native-e2e-results.md
            backend-primary-meta.json
            backend-primary.log
            backend-primary.rc
            backend-primary.seconds
            backend-recovery-triggered.txt
            backend-fallback-meta.json
            backend-fallback.log
            backend-fallback.rc
            backend-fallback.seconds
            frontend-native-meta.json
            frontend-native.log
            frontend-native.rc
            frontend-native.seconds
            docker-sandbox-ready.txt
            docker-sandbox-inspect.json
            native-e2e-meter/*.json
            native-e2e-meter/*.jsonl
            native-e2e-meter/*.log

      - name: Stop Docker sandbox
        if: always()
        run: docker rm -f agencybench-sandbox >/dev/null 2>&1 || true
