name: Add inline demo player

on:
  push:
    branches:
      - docs/inline-demo-player

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: docs/inline-demo-player
      - name: Replace demo link with inline player
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          old = 'https://raw.githubusercontent.com/sauravsingla/agentweave/main/assets/agentweave_100k_tools_silent_demo.mp4'
          new = '<video src="assets/agentweave_100k_tools_silent_demo.mp4" width="100%" controls preload="metadata"></video>'
          if old not in text:
              raise SystemExit('expected demo URL not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/inline-demo-player.yml
      - name: Commit README change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/inline-demo-player.yml
          git commit -m "Embed Demo Video player in README"
          git push origin HEAD:docs/inline-demo-player
