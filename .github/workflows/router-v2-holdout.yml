name: Router V2 External Holdout

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  router-v2-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install AgentWeave
        run: pip install -e .[dev]
      - name: Verify Router V2 tests
        run: pytest -q tests/test_router_v2.py tests/test_untouched_generalization.py

      - name: Fetch pinned General-AgentBench development prompts
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/cxcscmu/General-AgentBench.git external-general-agentbench
          cd external-general-agentbench
          git sparse-checkout init --cone
          git sparse-checkout set \
            general_agent/traces/baseline/mathhay_Claude-Haiku-4.5_distraction_all \
            general_agent/traces/baseline/mcpbench_Claude-Haiku-4.5_distraction_all \
            general_agent/traces/baseline/search_Claude-Haiku-4.5_distraction_all \
            general_agent/traces/baseline/swebench_Claude-Haiku-4.5_distraction_100 \
            general_agent/traces/baseline/tau2bench_Claude-Haiku-4.5_distraction_all \
            general_agent/traces/baseline/terminalbench_Claude-Haiku-4.5_distraction_100
          git checkout 35f5c027c31ddcb3366b28674c6cb2957460c0e2
          test "$(git rev-parse HEAD)" = "35f5c027c31ddcb3366b28674c6cb2957460c0e2"

      - name: Fetch preregistered external holdout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external-holdout

          git clone --filter=blob:none --no-checkout https://github.com/openai/grade-school-math.git external-holdout/grade-school-math
          cd external-holdout/grade-school-math
          git sparse-checkout init --cone
          git sparse-checkout set grade_school_math/data
          git checkout 3101c7d5072418e28b9008a6636bde82a006892c
          test "$(git rev-parse HEAD)" = "3101c7d5072418e28b9008a6636bde82a006892c"
          cd ../..

          git clone --filter=blob:none --no-checkout https://github.com/openai/human-eval.git external-holdout/human-eval
          cd external-holdout/human-eval
          git sparse-checkout init --cone
          git sparse-checkout set data
          git checkout 6d43fb980f9fee3c892a914eda09951f772ad10d
          test "$(git rev-parse HEAD)" = "6d43fb980f9fee3c892a914eda09951f772ad10d"
          cd ../..

          git clone --filter=blob:none --no-checkout https://github.com/princeton-nlp/intercode.git external-holdout/intercode
          cd external-holdout/intercode
          git sparse-checkout init --cone
          git sparse-checkout set data/nl2bash
          git checkout c3e46d827cfc9d4c704ec078f7abf9f41e3191d8
          test "$(git rev-parse HEAD)" = "c3e46d827cfc9d4c704ec078f7abf9f41e3191d8"
          cd ../..

      - name: Run Router V2 external holdout once
        run: |
          python scripts/router_v2_holdout.py \
            --development-root external-general-agentbench/general_agent/traces/baseline \
            --external-root external-holdout

      - name: Upload Router V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-v2-external-holdout-evidence
          path: |
            router-v2-holdout-results.json
            router-v2-holdout-results.md
            evaluation/router-v2-holdout.json
