name: External Environment Proof

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_hosted_a2a:
        description: Run independently hosted A2A targets
        required: false
        default: true
        type: boolean
      run_marketplaces:
        description: Run configured AWS/Foundry/Google marketplace proof
        required: false
        default: false
        type: boolean

jobs:
  external-a2a:
    if: ${{ github.event_name == 'push' || inputs.run_hosted_a2a }}
    runs-on: ubuntu-latest
    env:
      AGENTWEAVE_EXTERNAL_A2A_TARGETS: ${{ secrets.AGENTWEAVE_EXTERNAL_A2A_TARGETS }}
      AGENTWEAVE_EXTERNAL_RETRIES: '1'
      AGENTWEAVE_PUBLIC_A2A_TARGETS: >-
        [{"name":"Deep Research Archives","agent_card_url":"https://deepresearcharchives.com/.well-known/agent-card.json","implementation":"independently-hosted","rpc_method":"SendMessage","message":{"role":"ROLE_USER","messageId":"agentweave-dra-search","parts":[{"mediaType":"application/json","data":{"skill":"search_public_research","query":"agent interoperability architecture","limit":3}}]}},{"name":"Delx","agent_card_url":"https://api.delx.ai/.well-known/agent-card.json","implementation":"independently-hosted","rpc_method":"message/send","bootstrap":{"method":"agents/register","params":{"agent_id":"agentweave-live-proof-${{ github.run_id }}","agent_name":"AgentWeave Live Proof","source":"a2a"},"capture_headers":{"x-delx-agent-token":["agent_token","token","data.agent_token","data.token","result.agent_token","result.token"]}},"headers":{"x-delx-agent-id":"agentweave-live-proof-${{ github.run_id }}"},"message":{"role":"user","parts":[{"kind":"text","text":"AgentWeave real external A2A interoperability proof"}]},"params":{"agent_id":"agentweave-live-proof-${{ github.run_id }}","mode":"agent","minimal_response":true}}]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Select real independently hosted targets
        run: |
          if [ -z "$AGENTWEAVE_EXTERNAL_A2A_TARGETS" ]; then
            echo "AGENTWEAVE_EXTERNAL_A2A_TARGETS=$AGENTWEAVE_PUBLIC_A2A_TARGETS" >> "$GITHUB_ENV"
            # The public fallback proves real independently-hosted interoperability.
            # One public provider outage must not make repository CI red when another
            # independent provider is live; the artifact still records every target.
            echo "AGENTWEAVE_EXTERNAL_MIN_SUCCESSES=1" >> "$GITHUB_ENV"
          fi
      - name: Run real external A2A discovery and invocation
        run: python scripts/external_a2a_proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independently-hosted-a2a-proof
          path: external-a2a-proof.json
          if-no-files-found: warn

  real-marketplaces:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_marketplaces }}
    runs-on: ubuntu-latest
    env:
      AGENTWEAVE_REQUIRE_LIVE_PROOF: '1'
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AZURE_FOUNDRY_ENDPOINT: ${{ secrets.AZURE_FOUNDRY_ENDPOINT }}
      AZURE_FOUNDRY_TOKEN: ${{ secrets.AZURE_FOUNDRY_TOKEN }}
      AZURE_FOUNDRY_API_VERSION: ${{ secrets.AZURE_FOUNDRY_API_VERSION }}
      GOOGLE_A2A_AGENT_CARDS: ${{ secrets.GOOGLE_A2A_AGENT_CARDS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -e '.[aws]'
      - run: python scripts/production_proof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credentialed-marketplace-proof
          path: proof-results.json
          if-no-files-found: warn
