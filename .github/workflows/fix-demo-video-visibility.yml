name: Fix Demo Video Visibility

on:
  push:
    branches:
      - docs/fix-demo-video-visibility
    paths:
      - .github/workflows/fix-demo-video-visibility.yml

permissions:
  contents: write

jobs:
  render-visible-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fix-demo-video-visibility
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install pillow
      - name: Regenerate valid silent demo from benchmark facts
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import os

          out = Path('/tmp/aw_demo')
          out.mkdir(exist_ok=True)
          W, H = 1920, 1080
          BG=(12,16,24); PANEL=(24,31,43); TEXT=(242,245,249); MUTED=(170,180,193); ACC=(85,170,255); GREEN=(85,210,140)
          reg='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          mono='/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf'
          def F(n,b=False,m=False): return ImageFont.truetype(mono if m else (bold if b else reg), n)
          def base(title, sub=''):
              im=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(im)
              d.text((80,70),title,font=F(64,True),fill=TEXT)
              if sub: d.text((82,150),sub,font=F(32),fill=MUTED)
              d.text((80,1005),'AgentWeave v0.7.1  •  evaluation/runtime_scale.py  •  silent demo',font=F(27),fill=MUTED)
              return im,d
          def box(d): d.rounded_rectangle((95,250,1825,855),radius=28,fill=PANEL)
          scenes=[]
          im,d=base('AgentWeave at 100,000 tools','Real large-catalog routing benchmark — no mocked output'); box(d)
          d.text((150,340),'100,000 catalog tools',font=F(70,True),fill=TEXT); d.text((150,485),'→ 8 model-visible tools',font=F(64,True),fill=ACC); d.text((150,635),'✓ target tool still selected',font=F(48,True),fill=GREEN); scenes.append(im)
          im,d=base('The benchmark task','Route a customer-invoice lookup through a large noisy tool catalog'); box(d)
          d.text((150,355),'"find customer invoice by invoice identifier"',font=F(46),fill=TEXT); d.text((150,510),'Target:',font=F(36,True),fill=MUTED); d.text((150,575),'customer_invoice_lookup',font=F(52,True,m=True),fill=GREEN); scenes.append(im)
          im,d=base('Catalog sizes tested','Default scale sweep in evaluation/runtime_scale.py'); box(d)
          d.text((150,365),'100   →   1,000   →   10,000   →   100,000',font=F(56,True),fill=TEXT); d.text((150,520),'Route budget: 8',font=F(48,True),fill=ACC); d.text((150,650),'The run fails if the target tool is missed.',font=F(38),fill=MUTED); scenes.append(im)
          im,d=base('Real routing result','Target selected at every tested scale'); box(d)
          y=325
          for n in (100,1000,10000,100000):
              d.text((150,y),f'{n:,} tools',font=F(40,True),fill=TEXT); d.text((650,y),'→ 8 visible',font=F(40,True),fill=ACC); d.text((1100,y),'✓ target selected',font=F(40,True),fill=GREEN); y+=120
          scenes.append(im)
          im,d=base('100,000 → 8','Largest default benchmark case'); box(d)
          d.text((150,330),'100,000',font=F(100,True),fill=TEXT); d.text((650,365),'catalog tools',font=F(44),fill=MUTED); d.text((150,520),'8',font=F(110,True),fill=ACC); d.text((330,555),'model-visible tools',font=F(44),fill=MUTED); d.text((150,700),'99.992% candidate reduction',font=F(52,True),fill=GREEN); scenes.append(im)
          im,d=base('Relevant tool survives the reduction','The routed set keeps the intended action'); box(d)
          d.text((150,380),'✓ customer_invoice_lookup',font=F(56,True,m=True),fill=GREEN); d.text((150,555),'target_selected = true',font=F(48,True,m=True),fill=TEXT); d.text((150,690),'No external model or fabricated UI is required.',font=F(36),fill=MUTED); scenes.append(im)
          im,d=base('Reproduce it','Run the repository benchmark directly'); box(d)
          d.text((150,390),'python evaluation/runtime_scale.py',font=F(50,True,m=True),fill=TEXT); d.text((150,555),'Checks routing scale, selected count, target retention,',font=F(38),fill=MUTED); d.text((150,615),'latency and peak memory for each catalog size.',font=F(38),fill=MUTED); scenes.append(im)
          im,d=base('Route before you reason','AgentWeave v0.7.1'); box(d)
          d.text((150,375),'100,000 tools',font=F(66,True),fill=TEXT); d.text((700,375),'→',font=F(66,True),fill=ACC); d.text((830,375),'8 visible',font=F(66,True),fill=ACC); d.text((150,555),'✓ customer_invoice_lookup selected',font=F(48,True),fill=GREEN); scenes.append(im)
          paths=[]
          for i,im in enumerate(scenes,1):
              p=out/f'scene_{i:02d}.png'; im.save(p); paths.append(p)
          with (out/'concat.txt').open('w') as f:
              for p in paths:
                  f.write(f"file '{p}'\n"); f.write('duration 7.5\n')
              f.write(f"file '{paths[-1]}'\n")
          PY
          ffmpeg -y -f concat -safe 0 -i /tmp/aw_demo/concat.txt \
            -vf "fps=30,format=yuv420p" -c:v libx264 -preset medium -crf 20 -movflags +faststart \
            assets/agentweave_100k_tools_silent_demo.mp4
          ffmpeg -y -i assets/agentweave_100k_tools_silent_demo.mp4 \
            -vf "fps=8,scale=960:-1:flags=lanczos,palettegen=max_colors=128:stats_mode=diff" \
            /tmp/aw_palette.png
          ffmpeg -y -i assets/agentweave_100k_tools_silent_demo.mp4 -i /tmp/aw_palette.png \
            -lavfi "fps=8,scale=960:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle" \
            assets/agentweave_100k_tools_demo_preview.gif
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 assets/agentweave_100k_tools_silent_demo.mp4
      - name: Replace invisible video tag with visible preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md'); text=p.read_text()
          old='<video src="assets/agentweave_100k_tools_silent_demo.mp4" width="100%" controls preload="metadata"></video>'
          new='[![AgentWeave 100,000-tool demo](assets/agentweave_100k_tools_demo_preview.gif)](assets/agentweave_100k_tools_silent_demo.mp4)'
          if old not in text: raise SystemExit('expected inline video tag not found')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-demo-video-visibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/agentweave_100k_tools_silent_demo.mp4 assets/agentweave_100k_tools_demo_preview.gif .github/workflows/fix-demo-video-visibility.yml
          git commit -m "Fix Demo Video visibility and media"
          git push origin HEAD:docs/fix-demo-video-visibility
