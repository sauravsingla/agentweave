name: Refresh PyPI badge cache

on:
  push:
    branches:
      - fix/pypi-badge-cache-refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pypi-badge-cache-refresh
      - name: Refresh README PyPI badge URL
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          old = 'https://img.shields.io/pypi/v/agentweave-router.svg'
          new = 'https://img.shields.io/pypi/v/agentweave-router.svg?cacheSeconds=300&release=0.7.1'
          if old not in text:
              raise SystemExit('Expected PyPI badge URL not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit refreshed badge and remove one-shot workflow
        run: |
          rm .github/workflows/refresh-pypi-badge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/refresh-pypi-badge.yml
          git commit -m 'Refresh PyPI badge for v0.7.1'
          git push origin HEAD:fix/pypi-badge-cache-refresh
