name: AgencyBench Model-Generated Native E2E

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/agencybench-model-native-e2e.yml'
      - 'scripts/agencybench_native_e2e.py'

permissions:
  contents: read

jobs:
  model-native-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      AGENCYBENCH_PIN: ec65324be69e81bd4fe394ef6a86d48b8fa5da56
      CODER_MODEL: qwen2.5-coder:7b
      EVAL_MODEL_ID: agentweave-model-generated
    steps:
      - name: Checkout AgentWeave
        uses: actions/checkout@v5

      - name: Checkout pinned AgencyBench Backend scenario
        uses: actions/checkout@v5
        with:
          repository: GAIR-NLP/AgencyBench
          ref: ec65324be69e81bd4fe394ef6a86d48b8fa5da56
          path: external/AgencyBench
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            requirements.txt
            AgencyBench-v2/Backend/scenario1
            AgencyBench-v2/*/scenario*/description.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install AgentWeave and pinned AgencyBench runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r external/AgencyBench/requirements.txt
          pip install --upgrade 'sii-agent-sdk==0.1.11'

      - name: Route full Backend scenario with AgentWeave
        run: |
          python scripts/agencybench_native_e2e.py route \
            --agencybench-root external/AgencyBench \
            --scenario Backend/scenario1 \
            --output agencybench-model-native-route.json
          python - <<'PY'
          import json
          r=json.load(open('agencybench-model-native-route.json'))
          assert r['selected_family']=='Backend', r
          assert int(r['visible_subtasks'])==5, r
          print('AgentWeave selected Backend for the five-subtask AgencyBench scenario.')
          PY

      - name: Install Ollama and pull coding model
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          ollama pull "$CODER_MODEL"
          ollama list | tee ollama-models.txt

      - name: Prepare fixed build harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf model-workspace
          mkdir -p model-workspace/{src,data/scripts,data/history,logs,tests,bin}
          printf '[]\n' > model-workspace/data/users.json
          printf '["Hello!","How are you?","Got it."]\n' > model-workspace/data/scripts/bot_replies.json
          cat > model-workspace/Makefile <<'MAKE'
          CXX ?= g++
          CXXFLAGS ?= -std=c++17 -O2 -Wall -Wextra -pthread
          TARGET := bin/chat_app
          SRC := src/main.cpp
          .PHONY: all task1 task2 task3 task4 task5 run_task1 test_queue clean
          all: task5
          $(TARGET): $(SRC)
          	mkdir -p bin data logs data/history data/scripts
          	$(CXX) $(CXXFLAGS) $(SRC) -o $(TARGET)
          task1: $(TARGET)
          task2: $(TARGET)
          task3: $(TARGET)
          task4: $(TARGET)
          task5: $(TARGET)
          run_task1: task1
          	./$(TARGET)
          test_queue: tests/test_queue.cpp
          	$(CXX) $(CXXFLAGS) tests/test_queue.cpp -o bin/test_queue
          	./bin/test_queue
          clean:
          	rm -f $(TARGET) bin/test_queue
          MAKE

      - name: Generate incrementally, compile-gate, evaluate and repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, shutil, subprocess
          from pathlib import Path
          import httpx

          root=Path.cwd()
          bench=root/'external/AgencyBench/AgencyBench-v2/Backend/scenario1'
          workspace=root/'model-workspace'
          desc=json.loads((bench/'description.json').read_text())
          model=os.environ['CODER_MODEL']
          eval_model=os.environ['EVAL_MODEL_ID']
          requirements=[desc[f'subtask{i}'] for i in range(1,6)]
          usage=[]
          generation_no=0
          eval_no=0

          def call_model(prompt, label):
              global generation_no
              generation_no += 1
              payload={
                  'model':model,
                  'stream':False,
                  'format':'json',
                  'messages':[
                      {'role':'system','content':(
                          'You are a senior C++17 engineer. Return only valid JSON with exactly two complete replacement files: '
                          'src/main.cpp and tests/test_queue.cpp. The build compiles src/main.cpp as one translation unit. '
                          'Never include project-local headers such as auth.hpp, queue.hpp, json.hpp or any quoted #include. '
                          'Use only C++17 standard-library headers. Do not require third-party libraries. Preserve existing working behavior.'
                      )},
                      {'role':'user','content':prompt},
                  ],
                  'options':{'temperature':0,'num_ctx':24576,'num_predict':12000},
              }
              with httpx.Client(timeout=1200.0) as client:
                  r=client.post('http://127.0.0.1:11434/api/chat',json=payload)
                  r.raise_for_status()
                  data=r.json()
              raw=(data.get('message') or {}).get('content','')
              (root/f'model-generation-{generation_no:02d}-{label}.txt').write_text(raw)
              usage.append({
                  'generation':generation_no,'label':label,
                  'prompt_eval_count':data.get('prompt_eval_count',0),
                  'eval_count':data.get('eval_count',0),
                  'total_duration':data.get('total_duration',0),
              })
              try:
                  obj=json.loads(raw)
              except Exception:
                  m=re.search(r'\{.*\}',raw,re.S)
                  if not m:
                      raise RuntimeError('Model did not return a JSON object')
                  obj=json.loads(m.group(0))
              main=obj.get('src/main.cpp') or obj.get('main_cpp') or obj.get('main.cpp')
              testq=obj.get('tests/test_queue.cpp') or obj.get('test_queue_cpp') or obj.get('test_queue.cpp')
              if not isinstance(main,str) or len(main)<500:
                  raise RuntimeError('Model response lacks a substantial src/main.cpp')
              if not isinstance(testq,str) or len(testq)<100:
                  raise RuntimeError('Model response lacks tests/test_queue.cpp')
              (workspace/'src/main.cpp').write_text(main)
              (workspace/'tests/test_queue.cpp').write_text(testq)

          def compile_check(label):
              bad=[]
              main=(workspace/'src/main.cpp').read_text(errors='replace')
              if re.search(r'^\s*#\s*include\s*"',main,re.M):
                  bad.append('quoted/local include detected; src/main.cpp must be self-contained')
              commands=[['make','clean'],['make','task1'],['make','test_queue']]
              out=[]
              ok=not bad
              for cmd in commands:
                  p=subprocess.run(cmd,cwd=workspace,text=True,capture_output=True,timeout=60)
                  out.append(f"$ {' '.join(cmd)}\nrc={p.returncode}\n{p.stdout}\n{p.stderr}")
                  if p.returncode!=0: ok=False
              text=('STATIC CHECKS:\n'+'\n'.join(bad)+'\n\n' if bad else 'STATIC CHECKS: OK\n\n')+'\n'.join(out)
              (root/f'model-compile-check-{label}.txt').write_text(text)
              return ok,text

          def stage_checks(stage,label):
              cmds=[['./bin/chat_app','--version']]
              if stage>=2: cmds.append(['./bin/chat_app','--selftest','friend-menu'])
              if stage>=3: cmds.append(['./bin/chat_app','--selftest','chat-loop'])
              if stage>=4: cmds.append(['./bin/chat_app','--selftest','alias-search'])
              if stage>=5: cmds.extend([['./bin/chat_app','--selftest','concurrency'],['make','test_queue']])
              out=[]; ok=True
              for cmd in cmds:
                  try:
                      p=subprocess.run(cmd,cwd=workspace,text=True,capture_output=True,timeout=45)
                      out.append(f"$ {' '.join(cmd)}\nrc={p.returncode}\n{p.stdout}\n{p.stderr}")
                      if p.returncode!=0: ok=False
                      if cmd==['./bin/chat_app','--version'] and p.stdout.strip()!='1.0.0': ok=False
                  except Exception as e:
                      ok=False; out.append(f"$ {' '.join(cmd)}\nERROR {e}")
              text='\n'.join(out)
              (root/f'model-stage-check-{label}.txt').write_text(text)
              return ok,text

          def ensure_compiles(stage,label,cumulative):
              for repair in range(3):
                  ok,diag=compile_check(f'{label}-try{repair+1}')
                  if ok:
                      return True,diag
                  current=(workspace/'src/main.cpp').read_text(errors='replace')
                  testq=(workspace/'tests/test_queue.cpp').read_text(errors='replace')
                  if len(current)>18000: current=current[:18000]
                  if len(testq)>4500: testq=testq[:4500]
                  prompt=f'''The current cumulative stage {stage} implementation DOES NOT COMPILE. Fix compilation first without weakening implemented behavior.\n\nHard constraint: src/main.cpp is the only application translation unit. It must be completely self-contained and may use ONLY angle-bracket C++17 standard-library headers. Never use quoted includes or project headers. tests/test_queue.cpp must also be standalone.\n\nCUMULATIVE OFFICIAL REQUIREMENTS THROUGH STAGE {stage}:\n{cumulative}\n\nCOMPILER/STATIC DIAGNOSTICS:\n{diag[-9000:]}\n\nCURRENT src/main.cpp:\n{current}\n\nCURRENT tests/test_queue.cpp:\n{testq}\n\nReturn complete replacements for exactly src/main.cpp and tests/test_queue.cpp.'''
                  call_model(prompt,f'stage{stage}-compile-repair{repair+1}')
              ok,diag=compile_check(f'{label}-final')
              return ok,diag

          def native_eval(label):
              global eval_no
              eval_no += 1
              env=bench/'.env.agentweave-model'
              env.write_text(f'''CONDA_ENV_NAME=\nMAX_SUBTASK_ATTEMPTS=1\nSII_TARGET_MODEL={eval_model}\nSII_AGENT_API_KEY=eval-only-placeholder\nSII_AGENT_API_BASE_URL=http://127.0.0.1:1/v1\nSII_AUTH_TYPE=USE_OPENAI\nSII_SYSTEM_PROMPT=\nSII_MAX_TURNS=1\nBRIDGE_TIMEOUT_MS=1000\n''')
              model_dir=bench/eval_model
              shutil.rmtree(model_dir,ignore_errors=True)
              for i in range(1,6):
                  target=model_dir/f'subtask{i}/workspace/attempt_01'
                  target.mkdir(parents=True,exist_ok=True)
                  shutil.copytree(workspace,target,dirs_exist_ok=True)
              p=subprocess.run(['python','eval_task.py','--env',env.name,'--description','description.json','--eval-only'],cwd=bench,text=True,capture_output=True,timeout=600)
              log=p.stdout+'\n'+p.stderr
              (root/f'backend-model-native-eval-{eval_no:02d}-{label}.log').write_text(log)
              meta_path=model_dir/'meta_eval.json'
              if not meta_path.exists():
                  return None,0.0,[],log
              meta=json.loads(meta_path.read_text())
              scores=[float(x.get('best_score') or 0) for x in meta.get('subtasks',[])]
              mean=sum(scores)/len(scores) if scores else 0.0
              (root/f'backend-model-native-meta-{eval_no:02d}-{label}.json').write_text(json.dumps(meta,indent=2)+'\n')
              return meta,mean,scores,log

          def target_feedback(meta,idx):
              if not meta: return 'No native evaluator metadata yet.'
              sts=meta.get('subtasks') or []
              if idx>=len(sts): return 'No subtask metadata.'
              st=sts[idx]
              return json.dumps({'subtask':idx+1,'best_score':st.get('best_score'),'attempts':st.get('attempts') or []},indent=2)[:9000]

          best_meta=None; best_scores=[0.0]*5; best_mean=-1.0; best_stage=0

          for stage in range(1,6):
              cumulative='\n\n'.join(requirements[:stage])
              if stage==1:
                  current='No prior implementation.'
                  current_test='No prior queue test.'
              else:
                  (workspace/'src/main.cpp').write_text((root/'best-model-main.cpp').read_text())
                  (workspace/'tests/test_queue.cpp').write_text((root/'best-model-test_queue.cpp').read_text())
                  current=(workspace/'src/main.cpp').read_text(errors='replace')
                  current_test=(workspace/'tests/test_queue.cpp').read_text(errors='replace')
                  if len(current)>18000: current=current[:18000]
                  if len(current_test)>4500: current_test=current_test[:4500]

              feedback=target_feedback(best_meta,stage-1)
              prompt=f'''Implement cumulative AgencyBench Backend/scenario1 through SUBTASK {stage}. Work incrementally: preserve every requirement from earlier stages and add the new stage.\n\nThe fixed Makefile compiles ONLY src/main.cpp into bin/chat_app. Therefore src/main.cpp MUST be a single self-contained C++17 translation unit using only standard-library angle-bracket headers. Do not reference auth.hpp, queue.hpp, json.hpp, nlohmann/json, OpenSSL, or any other project/third-party file. tests/test_queue.cpp must also compile standalone with only C++17 standard library.\n\nRequired exact interface details include banner === Chat App v1.0.0 === and --version output exactly 1.0.0. Interactive behavior and persistence across process restart matter; selftests do not replace real flows.\n\nCUMULATIVE OFFICIAL REQUIREMENTS THROUGH SUBTASK {stage}:\n{cumulative}\n\nPRIOR NATIVE FEEDBACK FOR THIS SUBTASK (if available):\n{feedback}\n\nCURRENT BEST src/main.cpp:\n{current}\n\nCURRENT BEST tests/test_queue.cpp:\n{current_test}\n\nReturn complete replacement files as JSON keys exactly src/main.cpp and tests/test_queue.cpp.'''
              call_model(prompt,f'stage{stage}-increment')
              compile_ok,compile_diag=ensure_compiles(stage,f'stage{stage}',cumulative)
              if not compile_ok:
                  (root/f'model-stage-decision-{stage}.json').write_text(json.dumps({
                      'stage':stage,'accepted':False,'reason':'compile-gate-failed','scores':best_scores
                  },indent=2)+'\n')
                  print(f'Stage {stage}: compile gate failed; retaining prior accepted implementation.')
                  if stage==1:
                      raise RuntimeError('Stage 1 could not produce a compilable self-contained implementation')
                  continue

              local_ok,local_diag=stage_checks(stage,f'stage{stage}')
              meta,mean,scores,nlog=native_eval(f'stage{stage}')
              if meta is None:
                  accepted=False; reason='no-native-metadata'
              else:
                  target_improved=scores[stage-1] > best_scores[stage-1]
                  nonzero_ok=sum(s>0 for s in scores) >= sum(s>0 for s in best_scores)
                  mean_ok=mean >= best_mean
                  accepted=(stage==1) or (nonzero_ok and mean_ok and (target_improved or mean>best_mean))
                  reason='accepted' if accepted else 'native-no-improvement-or-regression'

              if meta is not None and not accepted:
                  current=(workspace/'src/main.cpp').read_text(errors='replace')
                  current_test=(workspace/'tests/test_queue.cpp').read_text(errors='replace')
                  if len(current)>18000: current=current[:18000]
                  if len(current_test)>4500: current_test=current_test[:4500]
                  fb=target_feedback(meta,stage-1)
                  repair_prompt=f'''Repair cumulative stage {stage} specifically against the pinned native evaluator feedback for SUBTASK {stage}. Preserve all earlier cumulative behavior. The code currently compiles; do not introduce any quoted/project includes or third-party dependency.\n\nCUMULATIVE REQUIREMENTS:\n{cumulative}\n\nPINNED NATIVE FEEDBACK:\n{fb}\n\nLOCAL STAGE CHECKS:\n{local_diag[-5000:]}\n\nCURRENT src/main.cpp:\n{current}\n\nCURRENT tests/test_queue.cpp:\n{current_test}\n\nReturn complete replacement files only.'''
                  call_model(repair_prompt,f'stage{stage}-native-repair')
                  repair_compile_ok,_=ensure_compiles(stage,f'stage{stage}-native-repair',cumulative)
                  if repair_compile_ok:
                      repair_local_ok,repair_local_diag=stage_checks(stage,f'stage{stage}-native-repair')
                      rmeta,rmean,rscores,rlog=native_eval(f'stage{stage}-native-repair')
                      if rmeta is not None:
                          rtarget=rscores[stage-1] > best_scores[stage-1]
                          rnonzero=sum(s>0 for s in rscores) >= sum(s>0 for s in best_scores)
                          rmean_ok=rmean >= best_mean
                          if rnonzero and rmean_ok and (rtarget or rmean>best_mean):
                              meta,mean,scores,nlog=rmeta,rmean,rscores,rlog
                              local_ok,local_diag=repair_local_ok,repair_local_diag
                              accepted=True; reason='accepted-after-native-repair'

              decision={
                  'stage':stage,'accepted':accepted,'reason':reason,
                  'previous_scores':best_scores,'candidate_scores':scores,
                  'previous_mean':best_mean,'candidate_mean':mean,
                  'compile_gate_passed':compile_ok,'stage_checks_passed':local_ok,
              }
              (root/f'model-stage-decision-{stage}.json').write_text(json.dumps(decision,indent=2)+'\n')
              if accepted:
                  best_meta=meta; best_scores=scores; best_mean=mean; best_stage=stage
                  shutil.copy(workspace/'src/main.cpp',root/'best-model-main.cpp')
                  shutil.copy(workspace/'tests/test_queue.cpp',root/'best-model-test_queue.cpp')
                  latest_meta=sorted(root.glob('backend-model-native-meta-*.json'),key=lambda p:p.stat().st_mtime)[-1]
                  latest_log=sorted(root.glob('backend-model-native-eval-*.log'),key=lambda p:p.stat().st_mtime)[-1]
                  shutil.copy(latest_meta,root/'backend-model-native-meta.json')
                  shutil.copy(latest_log,root/'backend-model-native.log')
              elif stage>1:
                  (workspace/'src/main.cpp').write_text((root/'best-model-main.cpp').read_text())
                  (workspace/'tests/test_queue.cpp').write_text((root/'best-model-test_queue.cpp').read_text())

          if best_meta is None:
              raise RuntimeError('No accepted native evaluator result')
          (workspace/'src/main.cpp').write_text((root/'best-model-main.cpp').read_text())
          (workspace/'tests/test_queue.cpp').write_text((root/'best-model-test_queue.cpp').read_text())
          final_compile_ok,final_compile_diag=compile_check('final')
          final_local_ok,final_local_diag=stage_checks(5,'final')
          (root/'model-usage.json').write_text(json.dumps(usage,indent=2)+'\n')
          (root/'best-model-stage.txt').write_text(str(best_stage)+'\n')
          (root/'best-model-scores.json').write_text(json.dumps(best_scores)+'\n')
          (root/'final-local-status.json').write_text(json.dumps({
              'compile_ok':final_compile_ok,'all_local_checks_ok':final_local_ok
          },indent=2)+'\n')
          print(f'Best native mean score: {best_mean:.2f}/10 from accepted stage {best_stage}; scores={best_scores}; compile_ok={final_compile_ok}; local_ok={final_local_ok}')
          PY

      - name: Build measured model-generated native report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          route=json.load(open('agencybench-model-native-route.json'))
          meta=json.load(open('backend-model-native-meta.json'))
          usage=json.load(open('model-usage.json'))
          local=json.load(open('final-local-status.json'))
          subtasks=meta.get('subtasks',[])
          scores=[float(x.get('best_score') or 0) for x in subtasks]
          attempts=sum(len(x.get('attempts') or []) for x in subtasks)
          result={
            'proof_mode':'model-generated-incremental-compile-gated-native-e2e',
            'generation_model':'qwen2.5-coder:7b',
            'agencybench_pin':'ec65324be69e81bd4fe394ef6a86d48b8fa5da56',
            'scenario':'Backend/scenario1',
            'agentweave_selected_family':route.get('selected_family'),
            'native_contracts_scored':len(subtasks),
            'native_rubric_attempts':attempts,
            'per_subtask_best_scores':scores,
            'mean_best_score':sum(scores)/len(scores) if scores else 0.0,
            'contracts_with_nonzero_score':sum(s>0 for s in scores),
            'best_accepted_stage':int(Path('best-model-stage.txt').read_text().strip()),
            'generation_calls':len(usage),
            'final_compile_gate_passed':bool(local.get('compile_ok')),
            'final_local_checks_passed':bool(local.get('all_local_checks_ok')),
            'model_prompt_tokens_reported':sum(int(x.get('prompt_eval_count') or 0) for x in usage),
            'model_completion_tokens_reported':sum(int(x.get('eval_count') or 0) for x in usage),
            'boundary':'After AgentWeave routes Backend/scenario1, qwen2.5-coder:7b builds the application cumulatively from subtask 1 through 5. Every candidate must compile as a self-contained C++17 translation unit before native AgencyBench scoring. Compile failures are repaired before evaluation, and later stages are accepted only when they do not regress the accepted native result. Scores come from the pinned upstream AgencyBench eval-only rubric.'
          }
          Path('agencybench-model-native-results.json').write_text(json.dumps(result,indent=2)+'\n')
          md='# AgencyBench model-generated native E2E\n\n'+''.join([
            f"- AgentWeave selected family: **{result['agentweave_selected_family']}**\n",
            f"- Generation model: **{result['generation_model']}**\n",
            f"- Native contracts scored: **{result['native_contracts_scored']}**\n",
            f"- Per-subtask scores: **{result['per_subtask_best_scores']}**\n",
            f"- Mean native score: **{result['mean_best_score']:.2f}/10**\n",
            f"- Contracts with non-zero score: **{result['contracts_with_nonzero_score']}/5**\n",
            f"- Best accepted incremental stage: **{result['best_accepted_stage']}**\n",
            f"- Final compile gate: **{result['final_compile_gate_passed']}**\n",
            f"- Final local checks: **{result['final_local_checks_passed']}**\n",
            f"- Model generation calls: **{result['generation_calls']}**\n",
            f"- Model-reported tokens: **{result['model_prompt_tokens_reported'] + result['model_completion_tokens_reported']}**\n\n",
            f"Boundary: {result['boundary']}\n"
          ])
          Path('agencybench-model-native-results.md').write_text(md)
          print(md)
          PY
          cat agencybench-model-native-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate model-generated native evidence
        run: |
          python - <<'PY'
          import json
          r=json.load(open('agencybench-model-native-results.json'))
          assert r['agentweave_selected_family']=='Backend', r
          assert r['native_contracts_scored']==5, r
          assert r['native_rubric_attempts']>=5, r
          assert r['contracts_with_nonzero_score']>=1, r
          assert r['mean_best_score']>0, r
          assert r['proof_mode']=='model-generated-incremental-compile-gated-native-e2e', r
          assert r['model_completion_tokens_reported']>0, r
          assert r['final_compile_gate_passed'] is True, r
          print('Incremental model-generated implementation produced real pinned AgencyBench native evidence and a compilable final artifact.')
          PY

      - name: Upload model-generated native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agencybench-model-native-e2e-evidence
          if-no-files-found: warn
          path: |
            agencybench-model-native-route.json
            agencybench-model-native-results.json
            agencybench-model-native-results.md
            backend-model-native-meta.json
            backend-model-native.log
            backend-model-native-meta-*.json
            backend-model-native-eval-*.log
            model-generation-*.txt
            model-compile-check-*.txt
            model-stage-check-*.txt
            model-stage-decision-*.json
            model-usage.json
            best-model-stage.txt
            best-model-scores.json
            final-local-status.json
            model-workspace/Makefile
            model-workspace/src/main.cpp
            model-workspace/tests/test_queue.cpp
            ollama-models.txt
