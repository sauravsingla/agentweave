name: README Paper Quality Update

on:
  push:
    branches:
      - research/paper-quality-evaluation

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/paper-quality-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Update README
        run: python scripts/update_readme_paper_quality_once.py
      - name: Commit README and remove temporary updater
        run: |
          git rm .github/workflows/readme-paper-quality-once.yml scripts/update_readme_paper_quality_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Document research paper-quality evaluation"
          git push origin HEAD:research/paper-quality-evaluation
