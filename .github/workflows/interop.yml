name: Live A2A Interoperability

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'JSON array of {name,agent_card_url,implementation}'
        required: true
        type: string
      sut_host:
        description: 'Optional A2A SUT base URL for official TCK'
        required: false
        type: string

jobs:
  live-interop:
    runs-on: ubuntu-latest
    env:
      AGENTWEAVE_A2A_TARGETS: ${{ inputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .[dev]
      - run: python scripts/live_interop.py

  official-tck:
    if: ${{ inputs.sut_host != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install uv
      - name: Clone official A2A TCK
        run: git clone --depth=1 https://github.com/a2aproject/a2a-tck.git /tmp/a2a-tck
      - name: Install TCK
        run: cd /tmp/a2a-tck && uv venv && uv pip install -e .
      - name: Run MUST-level conformance
        run: cd /tmp/a2a-tck && uv run ./run_tck.py --sut-host '${{ inputs.sut_host }}' --level must
