[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentweave"
version = "0.6.0"
description = "Pre-inference routing for tool-rich LLMs and multi-agent systems with MCP, A2A, LangGraph, AutoGen, policy-aware routing, recovery, and reproducible evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Saurav Singla" },
]
keywords = [
  "pre-inference-routing",
  "llm-routing",
  "tool-routing",
  "tool-selection",
  "function-calling",
  "mcp",
  "model-context-protocol",
  "agent-routing",
  "agent-orchestration",
  "multi-agent-systems",
  "a2a-protocol",
  "agent-interoperability",
  "agentic-ai",
  "langgraph",
  "autogen",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
  "networkx>=3.2",
]

[project.urls]
Homepage = "https://github.com/sauravsingla/agentweave"
Repository = "https://github.com/sauravsingla/agentweave"
Documentation = "https://github.com/sauravsingla/agentweave#readme"
"Research Paper" = "https://arxiv.org/abs/2608.23078"
Issues = "https://github.com/sauravsingla/agentweave/issues"
Changelog = "https://github.com/sauravsingla/agentweave/blob/main/CHANGELOG.md"

[project.optional-dependencies]
security = ["PyJWT[crypto]>=2.9", "cryptography>=42"]
api = ["fastapi>=0.115", "starlette>=0.41", "uvicorn>=0.30"]
tck = ["a2a-sdk==1.1.4", "starlette>=0.41", "uvicorn>=0.30", "sse-starlette>=2.1"]
grpc = ["grpcio>=1.70", "protobuf>=5.28"]
native = ["pybind11>=2.13"]
postgres = ["psycopg[binary]>=3.2"]
aws = ["boto3>=1.35"]
observability = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp>=1.27"]
edge = ["psutil>=6"]
yaml = ["PyYAML>=6"]
ontology = ["rdflib>=7.1"]
all = ["PyJWT[crypto]>=2.9", "cryptography>=42", "fastapi>=0.115", "starlette>=0.41", "uvicorn>=0.30", "a2a-sdk==1.1.4", "sse-starlette>=2.1", "grpcio>=1.70", "protobuf>=5.28", "pybind11>=2.13", "psycopg[binary]>=3.2", "boto3>=1.35", "opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp>=1.27", "psutil>=6", "PyYAML>=6", "rdflib>=7.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
agentweave = "agentweave.sdk:main"
agentweave-a2a-sut = "agentweave.a2a_server:main"

[project.entry-points."agentweave.plugins"]

[tool.setuptools.packages.find]
include = ["agentweave*", "agentweave_byom*"]
exclude = ["cpp*", "tests*", "examples*", "benchmarks*", "research*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires live external services or hardware", "scale: large scalability benchmark", "external: requires independently hosted endpoint or cloud credentials"]
