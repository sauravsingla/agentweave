[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentweave-router"
version = "0.7.0"
description = "Pre-inference routing for tool-rich LLMs and multi-agent systems with MCP, A2A, LangGraph, AutoGen, policy-aware routing, recovery, and reproducible evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Saurav Singla" },
]
keywords = [
  "pre-inference-routing",
  "llm-routing",
  "tool-routing",
  "tool-selection",
  "function-calling",
  "mcp",
  "model-context-protocol",
  "agent-routing",
  "agent-orchestration",
  "multi-agent-systems",
  "a2a-protocol",
  "agent-interoperability",
  "agentic-ai",
  "langgraph",
  "autogen",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.23",
  "networkx>=3.2",
]

[project.urls]
Homepage = "https://sauravsingla.github.io/agentweave/"
Repository = "https://github.com/sauravsingla/agentweave"
Documentation = "https://sauravsingla.github.io/agentweave/"
"Research Paper" = "https://arxiv.org/abs/2608.23078"
"Concept DOI" = "https://doi.org/10.5281/zenodo.22913459"
"Version DOI" = "https://doi.org/10.5281/zenodo.22913460"
"Software Archive" = "https://zenodo.org/records/22913460"
Issues = "https://github.com/sauravsingla/agentweave/issues"
Changelog = "https://github.com/sauravsingla/agentweave/blob/main/CHANGELOG.md"

[project.optional-dependencies]
security = ["PyJWT[crypto]>=2.9", "cryptography>=42"]
api = ["fastapi>=0.115", "starlette>=0.41", "uvicorn>=0.30"]
tck = ["a2a-sdk>=1.1.4,<2", "starlette>=0.41", "uvicorn>=0.30", "sse-starlette>=2.1"]
grpc = ["grpcio>=1.70", "protobuf>=5.28"]
native = ["pybind11>=2.13"]
postgres = ["psycopg[binary]>=3.2"]
aws = ["boto3>=1.35"]
observability = ["opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp>=1.27"]
edge = ["psutil>=6"]
yaml = ["PyYAML>=6"]
ontology = ["rdflib>=7.1"]
mcp = ["mcp>=2,<3"]
langgraph = ["langgraph>=1,<2"]
autogen = ["autogen-agentchat>=0.7,<1", "autogen-core>=0.7,<1"]
all-integrations = ["mcp>=2,<3", "langgraph>=1,<2", "autogen-agentchat>=0.7,<1", "autogen-core>=0.7,<1"]
all = ["PyJWT[crypto]>=2.9", "cryptography>=42", "fastapi>=0.115", "starlette>=0.41", "uvicorn>=0.30", "a2a-sdk>=1.1.4,<2", "sse-starlette>=2.1", "grpcio>=1.70", "protobuf>=5.28", "pybind11>=2.13", "psycopg[binary]>=3.2", "boto3>=1.35", "opentelemetry-api>=1.27", "opentelemetry-sdk>=1.27", "opentelemetry-exporter-otlp>=1.27", "psutil>=6", "PyYAML>=6", "rdflib>=7.1", "mcp>=2,<3", "langgraph>=1,<2", "autogen-agentchat>=0.7,<1", "autogen-core>=0.7,<1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.16.8,<0.17", "mypy>=2.3.1,<2.4", "bandit>=1.9,<2"]

[project.scripts]
agentweave = "agentweave.sdk:main"
agentweave-a2a-sut = "agentweave.a2a_server:main"

[project.entry-points."agentweave.plugins"]

[tool.setuptools.packages.find]
include = ["agentweave*", "agentweave_byom*"]
exclude = ["cpp*", "tests*", "examples*", "benchmarks*", "research*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires live external services or hardware", "scale: large scalability benchmark", "external: requires independently hosted endpoint or cloud credentials"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
